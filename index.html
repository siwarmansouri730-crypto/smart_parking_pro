<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking PRO</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: auto;
        }

        .screen {
            display: none;
            width: 100%;
        }

        .screen.active {
            display: block;
        }

        h1.title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 25px;
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.95rem;
            display: block;
            margin: 15px auto;
            text-align: center;
        }

        .link-btn:hover {
            text-decoration: underline;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .back-btn {
            background-color: var(--red);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* CARTE LOCALISATION GPS */
        .map-box {
            position: relative;
            width: 100%;
            height: 220px;
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .map-svg {
            width: 100%;
            height: 100%;
        }

        .pin {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .pin:hover {
            transform: scale(1.2);
        }

        .dest-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dest-card {
            background-color: #334155;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .dest-card:hover {
            background-color: #475569;
        }

        /* LÉGENDE POINTS VERT / ROUGE */
        .legend {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green { background-color: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.red { background-color: var(--red); box-shadow: 0 0 8px var(--red); }

        /* GRILLE PLACES AVEC MINIATURES VOITURES */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .slot-btn {
            background-color: var(--card-bg);
            border: 2px solid;
            padding: 15px 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            height: 105px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            position: relative;
            transition: all 0.2s;
        }

        .slot-btn .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .slot-btn .car-icon {
            font-size: 1.6rem;
            margin-bottom: 2px;
        }

        .slot-btn.available {
            border-color: var(--green);
            color: var(--green);
        }

        .slot-btn.available .status-dot {
            background-color: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .slot-btn.available:hover {
            background-color: rgba(34, 197, 94, 0.1);
            transform: scale(1.03);
        }

        .slot-btn.busy {
            border-color: var(--red);
            color: var(--red);
            cursor: not-allowed;
            opacity: 0.75;
        }

        .slot-btn.busy .status-dot {
            background-color: var(--red);
            box-shadow: 0 0 8px var(--red);
        }

        /* NOTIFICATION TOAST */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--green);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            color: #0f172a;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .modal-content label {
            color: #475569;
        }

        .modal-content input {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #0f172a;
        }

        .modal-content .btn {
            background-color: var(--bg-color);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Pop-up Notification -->
    <div id="notification" class="notification"></div>

    <div class="container">

        <!-- ÉTAPE 1 : SE CONNECTER -->
        <div id="login-screen" class="screen active">
            <h1 class="title">SMART PARKING</h1>
            <div class="card">
                <label>Email</label>
                <input type="email" id="login-email" value="siwarmansouri73@gmail.com" placeholder="votre@email.com">
                
                <label>Mot de passe</label>
                <input type="password" id="login-pass" value="••••••••" placeholder="••••••••">
                
                <button class="btn" onclick="handleLogin()">SE CONNECTER</button>
            </div>
            <button class="link-btn" onclick="alert('Module d\'inscription prêt ! Veuillez vous connecter.')">Pas de compte ? S'inscrire</button>
        </div>

        <!-- ÉTAPE 2 : LOCALISATION GPS -->
        <div id="landing-screen" class="screen">
            <h1 class="title">LOCALISATION & MAP</h1>
            
            <div class="map-box">
                <svg class="map-svg" viewBox="0 0 500 220">
                    <path d="M 40 110 Q 180 60 320 140 T 460 90" fill="none" stroke="#1e293b" stroke-width="20"/>
                    <path d="M 40 110 Q 180 60 320 140 T 460 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
                    <g class="pin" onclick="openMonitoring(PARKINGS[0])" transform="translate(90, 85)">
                        <circle cx="0" cy="0" r="10" fill="#22c55e" />
                        <text x="15" y="5" fill="#ffffff" font-size="12" font-weight="bold">Sidi Bou Said</text>
                    </g>
                    <g class="pin" onclick="openMonitoring(PARKINGS[1])" transform="translate(240, 105)">
                        <circle cx="0" cy="0" r="10" fill="#22c55e" />
                        <text x="15" y="5" fill="#ffffff" font-size="12" font-weight="bold">Centre Ville</text>
                    </g>
                    <g class="pin" onclick="openMonitoring(PARKINGS[2])" transform="translate(370, 130)">
                        <circle cx="0" cy="0" r="10" fill="#22c55e" />
                        <text x="-45" y="-15" fill="#ffffff" font-size="12" font-weight="bold">Lac 2</text>
                    </g>
                </svg>
            </div>

            <div class="dest-list" id="destinations-container"></div>
        </div>

        <!-- ÉTAPE 3 : SELECTION DE LA PLACE -->
        <div id="monitoring-screen" class="screen">
            <div class="nav-bar">
                <span id="parking-title" style="font-size: 1.1rem; font-weight: bold; color: var(--accent);"></span>
                <button class="back-btn" onclick="showScreen('landing-screen')">⬅ Retour</button>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <span class="dot green"></span>
                    <span>Libre (Point Vert)</span>
                </div>
                <div class="legend-item">
                    <span class="dot red"></span>
                    <span>Occupé (Point Rouge)</span>
                </div>
            </div>

            <div class="slots-grid" id="slots-container"></div>

            <div class="card">
                <h4 style="margin-bottom: 10px; color: var(--accent);">Historique des réservations</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Place</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="history-table">
                        <tr>
                            <td colspan="3" style="color: var(--muted); text-align: center;">Aucune réservation enregistrée.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ÉTAPE 4 : MODAL PAIEMENT -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h3>💳 PAIEMENT</h3>
            <label>Nom & Prénom</label>
            <input type="text" id="pay-name" value="Siwar Mansouri">
            
            <label>Numéro CIN</label>
            <input type="text" id="pay-cin" value="12345678">
            
            <label>Numéro de Carte</label>
            <input type="password" id="pay-card" value="4000123456789010">
            
            <button class="btn" onclick="confirmPayment()">CONFIRMER ET PAYER (5 DT)</button>
            <button class="link-btn" style="color: #ef4444; margin-top: 10px;" onclick="closePayment()">Annuler</button>
        </div>
    </div>

    <script>
        const PARKINGS = [
            { id: "P1", nom: "Parking Sidi Bou Said", icon: "🌊" },
            { id: "P2", nom: "Parking Centre Ville", icon: "🏙️" },
            { id: "P3", nom: "Parking Lac 2", icon: "💎" }
        ];

        const parking_slots = {
            "P1": ["A-01", "A-02", "A-03", "B-01", "B-02"],
            "P2": ["A-01", "A-02", "B-01", "B-02", "C-01"],
            "P3": ["A-01", "A-02", "A-03", "A-04"]
        };

        let busy_slots = [];
        let reservations = [];
        let currentParking = null;
        let selectedSlot = null;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if(email && pass) {
                loadLanding();
                showScreen('landing-screen');
            } else {
                alert("Veuillez saisir votre email et mot de passe.");
            }
        }

        function loadLanding() {
            const container = document.getElementById('destinations-container');
            container.innerHTML = '';
            PARKINGS.forEach(p => {
                const card = document.createElement('div');
                card.className = 'dest-card';
                card.onclick = () => openMonitoring(p);
                card.innerHTML = `
                    <span>${p.icon} &nbsp; ${p.nom}</span>
                    <span style="color: var(--accent); font-weight: bold;">Choisir ➔</span>
                `;
                container.appendChild(card);
            });
        }

        function openMonitoring(parking) {
            currentParking = parking;
            document.getElementById('parking-title').innerHTML = `${parking.icon} ${parking.nom}`;
            renderSlots();
            renderHistory();
            showScreen('monitoring-screen');
        }

        function renderSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            
            parking_slots[currentParking.id].forEach(place_id => {
                const full_id = `${currentParking.id}_${place_id}`;
                const isBusy = busy_slots.includes(full_id);
                
                const btn = document.createElement('button');
                btn.className = `slot-btn ${isBusy ? 'busy' : 'available'}`;
                btn.innerHTML = `
                    <span class="status-dot"></span>
                    <span class="car-icon">🚗</span>
                    <span>${place_id}</span>
                `;
                
                if(!isBusy) {
                    btn.onclick = () => openPayment(place_id);
                }
                container.appendChild(btn);
            });
        }

        function openPayment(place_id) {
            selectedSlot = place_id;
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closePayment() {
            document.getElementById('payment-modal').style.display = 'none';
        }

        function triggerNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3500);
        }

        function confirmPayment() {
            const name = document.getElementById('pay-name').value.trim();
            const cin = document.getElementById('pay-cin').value.trim();
            const card = document.getElementById('pay-card').value.trim();

            if(name && cin && card) {
                const full_id = `${currentParking.id}_${selectedSlot}`;
                busy_slots.push(full_id);
                
                reservations.push({
                    name: name,
                    parking: currentParking.nom,
                    slot: selectedSlot
                });

                closePayment();
                renderSlots();
                renderHistory();
                
                triggerNotification(`Réservation confirmée ! La place ${selectedSlot} est maintenant rouge (réservée à ${name}).`);
            } else {
                alert("Veuillez renseigner tous les détails du paiement.");
            }
        }

        function renderHistory() {
            const tbody = document.getElementById('history-table');
            const currentRes = reservations.filter(r => r.parking === currentParking.nom);
            
            if(currentRes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: var(--muted); text-align: center;">Aucune réservation enregistrée.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            currentRes.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.name}</td>
                    <td><strong>${r.slot}</strong></td>
                    <td><span style="color: var(--red); font-weight: bold;">Occupée (Rouge)</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
